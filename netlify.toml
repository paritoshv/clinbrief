# The Next.js app lives in a subdirectory, so Netlify builds from there.
[build]
  base = "asha"
  command = "npm run build"
  # Relative to `base`, so this resolves to asha/.next. Set explicitly because a
  # UI-configured publish directory of "asha" resolves to the base directory
  # itself, which the Next runtime rejects — and netlify.toml overrides the UI.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Explicit rather than relying on auto-detection, which is less reliable when the
# app is not at the repo root.
[[plugins]]
  package = "@netlify/plugin-nextjs"
